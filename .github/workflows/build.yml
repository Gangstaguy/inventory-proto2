name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Modellen (Core ML) skapas på bygg-servern och sparas i cache,
      # så bara första bygget (eller när export_model.py ändras) tar lång tid.
      - name: Cache model
        id: modelcache
        uses: actions/cache@v4
        with:
          path: ModelRes
          key: model-${{ hashFiles('export_model.py') }}

      - uses: actions/setup-python@v5
        if: steps.modelcache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Install Python packages
        if: steps.modelcache.outputs.cache-hit != 'true'
        run: pip install torch==2.5.1 torchvision==0.20.1 coremltools==8.2 "numpy<2" open_clip_torch pillow

      - name: Export model to Core ML
        if: steps.modelcache.outputs.cache-hit != 'true'
        run: python export_model.py

      - name: Compile model
        if: steps.modelcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ModelRes
          xcrun coremlcompiler compile ProductEmbedder.mlpackage ModelRes
          ls ModelRes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project InventoryProto.xcodeproj -scheme InventoryProto \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep "error:" build.log | head -20; exit 1; }

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/InventoryProto.app Payload/
          zip -qr InventoryProto.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: InventoryProto-ipa
          path: InventoryProto.ipa
